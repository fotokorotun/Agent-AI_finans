name: Update and Deploy Dashboard

on:
  schedule:
    # Запуск каждый будний день в 08:00 UTC (можно настроить любое время)
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Позволяет запускать обновление вручную кнопкой в GitHub

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Запуск мотора генерации (generate_analysis.py)
        run: |
          python generate_analysis.py

      - name: Деплой на GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./