name: Update and Deploy Dashboard

on:
  schedule:
    # Запуск в 09:00, 13:00 и 19:00 UTC (10:00, 14:00 и 20:00 по местному времени в Барселоне) с понедельника по пятницу
    - cron: '0 9,13,19 * * 1-5'
  workflow_dispatch: # Позволяет запускать воркфлоу вручную из интерфейса GitHub Actions

# Разрешения, необходимые для корректной публикации на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run analysis motor & build dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== WATCHLIST CONTENT ==="
          cat watchlist.txt
          echo "========================="
          python generate_analysis.py
          python build_dashboard.py

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4