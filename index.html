        body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
        .card-bg { background-color: #111827; border: 1px solid #1f2937; }
    </style>

<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="flex justify-between items-center pb-6 border-b border-gray-800">
            <div>
                <h1 class="text-2xl font-bold text-white">🛰️ Portfolio Management Dashboard</h1>
                <p class="text-sm text-gray-400">Мониторинг активов, институциональных потоков и стратегий</p>
            </div>
            <div class="card-bg p-4 rounded-xl flex items-center gap-4">
                <div>
                    <div class="text-xs text-gray-400 font-semibold">БЮДЖЕТ:</div>
                    <div class="text-2xl font-bold text-emerald-400" id="budgetValueDisplay">500 €</div>
                </div>
                <input type="range" id="budgetSlider" min="500" max="20000" step="500" value="500" 
                    class="w-40 accent-emerald-500 cursor-pointer" oninput="updatePortfolio(this.value)">
            </div>
        </header>

        <div class="flex flex-wrap gap-3">
            <button onclick="setFilter('top10')" id="btnTop10" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold text-sm">🔥 Топ-10: Рост</button>
            <button onclick="setFilter('passive10')" id="btnPass10" class="px-4 py-2 card-bg text-gray-300 rounded-lg font-semibold text-sm">💰 Топ-10: Пассивный доход</button>
            <button onclick="setFilter('all')" id="btnAll" class="px-4 py-2 card-bg text-gray-300 rounded-lg font-semibold text-sm">📋 Все активы</button>
        </div>

        <div class="card-bg rounded-xl overflow-hidden shadow-xl">

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-800 text-xs text-gray-400 uppercase bg-gray-900/50">
                            <th class="p-3">Тикер / Компания</th>
                            <th class="p-3">Сектор</th>
                            <th class="p-3">Цена (€)</th>
                            <th class="p-3">Доля / Сумма</th>
                            <th class="p-3">Штук</th>
                            <th class="p-3 text-emerald-400">Прибыль 6M</th>
                            <th class="p-3 text-emerald-400">Прибыль 1Y</th>
                            <th class="p-3">Риск</th>
                            <th class="p-3">Долг</th>
                            <th class="p-3">Моментум</th>
                            <th class="p-3">Волатильность</th>
                        </tr>
                    </thead>
                    <tbody id="portfolioTableBody" class="divide-y divide-gray-800"></tbody>

            </div>

        },
{
            ticker: "ISF.L",
            name: "ISHARES PLC ISHARES CORE FTSE10",
            sector: "Dividend / Defensive",
            priceEur: 12.54,
            isTop10: false,
            isPass10: false,
            weightTop: 0.0,
            weightPass: 0.0,
            ret6m: "+8.0%",
            ret1y: "+15.0%",
            risk: "Низкий",
            debt: "Низкий",
            mood: "Стабильный",
            vol: "Средняя"
        },
{
            ticker: "ISUK.L",
            name: "ISUK.L",
            sector: "Dividend / Defensive",
            priceEur: 50.0,
            isTop10: false,
            isPass10: false,
            weightTop: 0.0,
            weightPass: 0.0,
            ret6m: "+8.0%",
            ret1y: "+15.0%",
            risk: "Низкий",
            debt: "Низкий",
            mood: "Стабильный",
            vol: "Средняя"
        }];
        let currentFilter = 'top10';

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('btnTop10').className = filter === 'top10' ? 'px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold text-sm' : 'px-4 py-2 card-bg text-gray-300 rounded-lg font-semibold text-sm';
            document.getElementById('btnPass10').className = filter === 'passive10' ? 'px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-sm' : 'px-4 py-2 card-bg text-gray-300 rounded-lg font-semibold text-sm';
            document.getElementById('btnAll').className = filter === 'all' ? 'px-4 py-2 bg-emerald-600 text-white rounded-lg font-semibold text-sm' : 'px-4 py-2 card-bg text-gray-300 rounded-lg font-semibold text-sm';
            
            document.getElementById('tableTitle').innerText = filter === 'top10' ? 'Топ-10 агрессивного роста' : (filter === 'passive10' ? 'Топ-10 пассивного дохода' : 'Полный список всех активов');
            updatePortfolio(document.getElementById('budgetSlider').value);
        }

        function updatePortfolio(budval) {
            const budgetNum = parseFloat(budval);
            document.getElementById('budgetValueDisplay').innerText = budgetNum.toLocaleString() + ' €';
            let tbody = document.getElementById('portfolioTableBody');
            tbody.innerHTML = '';

            let filtered = currentFilter === 'top10' ? allPortfolioData.filter(i => i.isTop10) : (currentFilter === 'passive10' ? allPortfolioData.filter(i => i.isPass10) : allPortfolioData);

            filtered.forEach(item => {
                let weight = currentFilter === 'top10' ? item.weightTop : (currentFilter === 'passive10' ? item.weightPass : 0);
                const itemBudget = currentFilter !== 'all' ? budgetNum * weight : 0;
                const shares = currentFilter !== 'all' && item.priceEur > 0 ? itemBudget / item.priceEur : 0;

                let row = document.createElement('tr');
                row.className = 'hover:bg-gray-800/40 transition-colors';
                row.innerHTML = `
                    <td class="p-3 font-mono font-bold text-emerald-400">${item.ticker} <span class="block text-xs font-normal text-gray-400">${item.name}</span></td>
                    <td class="p-3 text-gray-300">${item.sector}</td>
                    <td class="p-3 font-mono">${item.priceEur.toFixed(2)} €</td>
                    <td class="p-3 font-mono">${currentFilter !== 'all' ? '<b>' + (weight * 100).toFixed(0) + '%</b> (' + itemBudget.toFixed(2) + ' €)' : '<span class="text-gray-500">-</span>'}</td>
                    <td class="p-3 font-mono text-emerald-300">${currentFilter !== 'all' ? shares.toFixed(2) + ' шт.' : '-'}</td>
                    <td class="p-3 font-mono font-bold text-emerald-400">${item.ret6m}</td>
                    <td class="p-3 font-mono font-bold text-emerald-400">${item.ret1y}</td>
                    <td class="p-3 text-xs"><span class="px-2 py-1 bg-gray-800 rounded text-amber-300">${item.risk}</span></td>
                    <td class="p-3 text-xs text-gray-300">${item.debt}</td>
                    <td class="p-3 text-xs text-blue-300 font-semibold">${item.mood}</td>
                    <td class="p-3 text-xs text-gray-400">${item.vol}</td>
                `;
                tbody.appendChild(row);
            });
        }
        updatePortfolio(500);
    </script>
</body>
